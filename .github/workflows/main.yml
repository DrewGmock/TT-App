name: Build TT Helper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Find and extract TT Helper package
        shell: bash
        run: |
          echo "Looking for TT Helper ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'TT-Helper-*.zip' \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No TT-Helper ZIP found in repository root."
            exit 1
          fi

          echo "Using package:"
          echo "$ZIP_FILE"

          rm -rf build-src
          mkdir build-src

          unzip -q "$ZIP_FILE" -d build-src

          echo ""
          echo "Extracted project:"
          ls -la build-src

          if [ ! -d "build-src/app" ]; then
            echo "ERROR: Extracted ZIP does not contain app/"
            exit 1
          fi

          if [ ! -f "build-src/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts missing from ZIP."
            exit 1
          fi

      - name: Read app version
        id: version
        shell: bash
        run: |
          echo "App version:"
          grep -n "versionCode" build-src/app/build.gradle.kts
          grep -n "versionName" build-src/app/build.gradle.kts

          VERSION_NAME=$(grep 'versionName' build-src/app/build.gradle.kts \
            | head -n 1 \
            | sed -E 's/.*versionName *= *"([^"]+)".*/\1/')

          echo "Detected version: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          gradle \
            --no-daemon \
            -p build-src \
            :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp build-src/app/build/outputs/apk/debug/app-debug.apk \
            "TT-Helper-${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TT-Helper-${{ steps.version.outputs.version_name }}
          path: TT-Helper-${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 14
